name: dbt CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Gerar dados sintéticos
        run: python generator/main.py

      - name: Instalar pacotes do dbt
        working-directory: revops
        run: dbt deps

      - name: Rodar modelos e testes
        working-directory: revops
        run: dbt build

      - name: Gerar documentação
        working-directory: revops
        run: |
          dbt docs generate --static
          mkdir -p ../site
          cp target/static_index.html ../site/index.html

      - name: Enviar documentação para o Pages
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
