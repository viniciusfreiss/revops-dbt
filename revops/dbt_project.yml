name: 'revops'
version: '1.0.0'
config-version: 2

profile: 'revops'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

vars:
  # Tempo sem atividade que encerra uma sessão
  session_timeout_minutes: 30
  # Eventos disparados pelo backend. Não representam visita e ficam fora das sessões.
  server_side_events: ['kyc_approved', 'investment_started']
  # Pesos do modelo position based. O que sobra vai para os toques do meio.
  attribution_first_touch_weight: 0.4
  attribution_last_touch_weight: 0.4
  # Parte do volume aportado que vira receita para a plataforma (premissa)
  revenue_take_rate: 0.02

clean-targets:
  - "target"
  - "dbt_packages"

models:
  revops:
    staging:
      +materialized: view
    intermediate:
      +materialized: table
    marts:
      +materialized: table

seeds:
  revops:
    products:
      +column_types:
        product_id: varchar
        product_name: varchar
        product_type: varchar
