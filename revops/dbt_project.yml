name: 'revops'
version: '1.0.0'
config-version: 2

profile: 'revops'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

vars:
  # Tempo sem atividade que encerra uma sessão
  session_timeout_minutes: 30
  # Eventos disparados pelo backend. Não representam visita e ficam fora das sessões.
  server_side_events: ['kyc_approved', 'investment_started']

clean-targets:
  - "target"
  - "dbt_packages"

models:
  revops:
    staging:
      +materialized: view
    intermediate:
      +materialized: table

seeds:
  revops:
    products:
      +column_types:
        product_id: varchar
        product_name: varchar
        product_type: varchar
