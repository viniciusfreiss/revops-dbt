name: 'revops'
version: '1.0.0'
config-version: 2

profile: 'revops'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  revops:
    staging:
      +materialized: view

seeds:
  revops:
    products:
      +column_types:
        product_id: varchar
        product_name: varchar
        product_type: varchar
