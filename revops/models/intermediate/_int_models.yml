version: 2

models:
  - name: int_identity_map
    description: >
      Mapa de identidade. Uma linha por anonymous_id que chegou a se cadastrar,
      com o user_id correspondente e o momento em que o vínculo foi feito.
    columns:
      - name: anonymous_id
        data_tests:
          - unique
          - not_null
      - name: user_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_backend__users')
                field: user_id
      - name: linked_at
        description: Primeiro evento com anonymous_id e user_id juntos.
        data_tests:
          - not_null

  - name: int_events_identified
    description: >
      Eventos do Segment com o user_id preenchido retroativamente.
      Uma linha por evento, a mesma grain do staging.
    columns:
      - name: event_id
        data_tests:
          - unique
          - not_null
      - name: user_id
        description: >
          Usuário do evento. Nulo apenas para visitantes que nunca se cadastraram.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_backend__users')
                field: user_id
      - name: is_backfilled
        description: >
          Verdadeiro quando o evento era anônimo e o usuário foi descoberto
          pelo mapa de identidade.

  - name: int_events_sessionized
    description: >
      Eventos de navegação com a sessão a que pertencem. Uma linha por evento.
      Eventos do backend (var server_side_events) ficam de fora.
    columns:
      - name: event_id
        data_tests:
          - unique
          - not_null
      - name: session_id
        data_tests:
          - not_null
      - name: event_sequence
        description: Posição do evento dentro da sessão, começando em 1.

  - name: int_sessions
    description: >
      Uma linha por sessão, com canal definido pelo evento de entrada.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "started_at <= ended_at"
    columns:
      - name: session_id
        data_tests:
          - unique
          - not_null
      - name: channel
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['google', 'meta', 'tiktok', 'linkedin', 'bing', 'organic', 'direct']
      - name: channel_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['paid', 'organic', 'direct']

  - name: int_deal_touchpoints
    description: >
      Sessões que antecederam cada deal, dentro da janela de atribuição.
      Uma linha por deal e sessão.
    columns:
      - name: touchpoint_id
        data_tests:
          - unique
          - not_null
      - name: session_id
        description: >
          Cada sessão entra em no máximo um deal, porque as janelas
          de deals do mesmo usuário não se sobrepõem.
        data_tests:
          - unique
          - not_null
      - name: deal_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_hubspot__deals')
                field: deal_id
      - name: deal_number
        description: Ordem do deal na história do usuário, começando em 1.
      - name: touch_number
        description: Posição do toque na jornada do deal, começando em 1.
      - name: total_touches
        description: Quantidade de toques da jornada do deal.
      - name: days_before_deal
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
