version: 2

seeds:
  - name: products
    description: Produtos da esteira de renda fixa. Tabela de referência estática.
    columns:
      - name: product_id
        data_tests:
          - unique
          - not_null
      - name: product_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['CRI', 'CRA', 'debenture', 'CCB']
